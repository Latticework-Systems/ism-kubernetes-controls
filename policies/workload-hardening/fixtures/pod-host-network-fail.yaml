# Fails block-host-namespaces (hostNetwork branch).
apiVersion: v1
kind: Pod
metadata:
  name: pod-host-network-fail
  namespace: production
spec:
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: registry.internal/app:v1.0.0
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
