# Fails require-drop-all-capabilities.
# capabilities.drop does not include "ALL". The rule uses AllNotIn ["ALL"]
# which is true when "ALL" is absent from the drop list → denied.
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-drop-all-fail
  namespace: production
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: registry.internal/app:v1.0.0
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["NET_RAW"]   # Does not include ALL
