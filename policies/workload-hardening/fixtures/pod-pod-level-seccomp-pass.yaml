# Tests pod-level seccompProfile inheritance for require-seccomp-profile.
# seccompProfile is set at pod level only — no container-level override.
# The rule checks: element.securityContext.seccompProfile.type ||
#                  request.object.spec.securityContext.seccompProfile.type
# Pod-level value should satisfy the rule.
apiVersion: v1
kind: Pod
metadata:
  name: pod-pod-level-seccomp-pass
  namespace: production
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: registry.internal/app:v1.0.0
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      # No seccompProfile at container level — should inherit from pod
