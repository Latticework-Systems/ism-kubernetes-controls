# Fails require-run-as-non-root.
# Neither runAsNonRoot nor runAsUser is set at pod or container level.
# Both conditions of the deny are true → denied.
apiVersion: v1
kind: Pod
metadata:
  name: pod-runs-as-root-fail
  namespace: production
spec:
  containers:
  - name: app
    image: registry.internal/app:v1.0.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
