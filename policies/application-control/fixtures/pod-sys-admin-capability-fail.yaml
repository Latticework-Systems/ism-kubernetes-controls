# Fails check-no-privileged because SYS_ADMIN is privileged-equivalent.
# Uses an approved registry and a version tag so only the privileged rule fires.
apiVersion: v1
kind: Pod
metadata:
  name: pod-sys-admin-capability-fail
  namespace: production
spec:
  containers:
  - name: app
    image: registry.internal/myapp:v1.0
    securityContext:
      capabilities:
        add:
        - SYS_ADMIN
