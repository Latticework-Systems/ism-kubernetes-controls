# Passes check-approved-registry because docker.io/nginx:1.25 normalizes to
# docker.io/library/nginx:1.25 and docker.io/library/* is approved.
apiVersion: v1
kind: Pod
metadata:
  name: pod-dockerhub-library-explicit-pass
  namespace: production
spec:
  containers:
  - name: app
    image: docker.io/nginx:1.25
