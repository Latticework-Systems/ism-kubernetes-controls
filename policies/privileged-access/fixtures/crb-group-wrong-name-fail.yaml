# Fails block-cluster-admin-to-non-breakglass-subjects.
# Subject kind is Group but name is 'platform-engineers', not 'break-glass'.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: engineers-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: Group
  name: platform-engineers
  apiGroup: rbac.authorization.k8s.io
