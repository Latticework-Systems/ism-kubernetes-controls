# Fails block-legacy-sa-token-secrets — type kubernetes.io/service-account-token
# creates a long-lived, non-expiring SA token and is blocked by this policy.
apiVersion: v1
kind: Secret
metadata:
  name: secret-legacy-token-fail
  namespace: production
  annotations:
    kubernetes.io/service-account.name: myapp-sa
type: kubernetes.io/service-account-token
