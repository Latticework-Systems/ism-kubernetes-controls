# Fails block-cluster-admin-to-non-breakglass-subjects.
# Subject kind is ServiceAccount — only Group subjects are permitted for cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sa-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: myapp-sa
  namespace: production
