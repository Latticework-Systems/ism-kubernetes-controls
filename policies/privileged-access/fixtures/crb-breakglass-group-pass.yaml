# Passes block-cluster-admin-to-non-breakglass-subjects.
# Subject is a Group named 'break-glass' — the only permitted cluster-admin subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakglass-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: Group
  name: break-glass
  apiGroup: rbac.authorization.k8s.io
