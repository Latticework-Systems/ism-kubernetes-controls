readme: |
  # ISM Patch Applications

  Requires images to carry a build-date annotation and a passing vulnerability scan result, and gates internet-facing workloads on image age.

  ## ISM controls evidenced

  | Control | Coverage | Title |
  | --- | --- | --- |
  | ISM-1690 | partial | Patches, updates or other vendor mitigations for vulnerabilities in online services are applied within two weeks of release when vulnerabilities are assessed as non-critical by vendors and no working exploits exist. |
  | ISM-1693 | partial | Patches, updates or other vendor mitigations for vulnerabilities in applications other than office productivity suites, web browsers and their extensions, email clients, PDF applications, and security products are applied within one month of release. |
  | ISM-1698 | partial | A vulnerability scanner is used at least daily to identify missing patches or updates for vulnerabilities in online services. |
  | ISM-1700 | partial | A vulnerability scanner is used at least fortnightly to identify missing patches or updates for vulnerabilities in applications other than office productivity suites, web browsers and their extensions, email clients, PDF applications, and security products. |
  | ISM-1808 | partial | A vulnerability scanner with an up-to-date vulnerability database is used for vulnerability scanning activities. |
  | ISM-1876 | partial | Patches, updates or other vendor mitigations for vulnerabilities in online services are applied within 48 hours of release when vulnerabilities are assessed as critical by vendors or when working exploits exist. |

  ## Evidence boundary

  Each mapping below is partial evidence. A PolicyReport shows what the cluster
  admitted. It does not discharge an ISM control, and it is not an assessment.

  - **ISM-1690**: PolicyReports show declared image build age at admission; they do not prove the image includes every applicable vendor patch.
  - **ISM-1693**: PolicyReports show declared image build age at admission; they do not prove dependency-level remediation or the vendor release date.
  - **ISM-1698**: PolicyReports show a declared successful image scan at admission; they do not prove scanner cadence, coverage or current vulnerability data.
  - **ISM-1700**: PolicyReports show a declared successful image scan at admission; they do not prove fortnightly cadence or dependency-level scan coverage.
  - **ISM-1808**: PolicyReports show only the workload's declared scan result; scanner identity, database freshness and scan configuration require pipeline evidence.
  - **ISM-1876**: Admission-time image age is supporting evidence only; criticality, exploit status and the 48-hour remediation clock require vulnerability pipeline data.

  ## Policies in this package

  - `ism-patch-applications-require-build-date`: ISM — Patch Applications: Require Build Date Annotation (severity: high)
  - `ism-patch-applications-require-scan-passed`: ISM — Patch Applications: Require Vulnerability Scan (severity: high)
  - `ism-patch-applications-image-age-gate`: ISM — Patch Applications: Image Age Gate (severity: high)

  ## Notes

  Your build pipeline stamps the annotations these policies read. A pass shows the pipeline ran. It says nothing about whether the scanner was right or whether anyone fixed what it found.

  The canonical mapping, its ASD OSCAL provenance and the Kyverno test suite are
  maintained at https://github.com/Latticework-Systems/ism-kubernetes-controls.
