readme: |
  # ISM Regular Backups

  Requires production PersistentVolumeClaims to declare an explicit backup disposition label, so unlabelled storage cannot reach production unnoticed.

  ## ISM controls evidenced

  | Control | Coverage | Title |
  | --- | --- | --- |
  | ISM-1511 | partial | Backups of data, applications and settings are performed and retained in accordance with business criticality and business continuity requirements. |

  ## Evidence boundary

  Each mapping below is partial evidence. A PolicyReport shows what the cluster
  admitted. It does not discharge an ISM control, and it is not an assessment.

  - **ISM-1511**: PolicyReports show whether production PVCs declare backup coverage; they do not prove backup completion, retention, resilience or restorability.

  ## Policies in this package

  - `ism-backups-require-pvc-backup-label`: ISM — Regular Backups: Require PVC Backup Label (severity: medium)

  ## Notes

  This package ships the admission policy alone. The Velero Schedules, etcd backup reference and monthly restoration-test CronJob that produce the rest of the backup evidence live in the source repository at https://github.com/Latticework-Systems/ism-kubernetes-controls/tree/main/policies/backups.

  The canonical mapping, its ASD OSCAL provenance and the Kyverno test suite are
  maintained at https://github.com/Latticework-Systems/ism-kubernetes-controls.
