readme: |
  # ISM Workload Hardening

  Requires a hardened container security context, blocks host namespace sharing and hostPath volumes, and requires a read-only root filesystem.

  ## ISM controls evidenced

  | Control | Coverage | Title |
  | --- | --- | --- |
  | ISM-1246 | partial | Server applications are hardened using ASD and vendor hardening guidance, with the most restrictive guidance taking precedence when conflicts occur. |
  | ISM-1604 | partial | When using a software-based isolation mechanism that consumes shared physical computing resources, the configuration of the isolation mechanism is hardened by removing unneeded functionality and restricting access to the administrative interface used to manage the isolation mechanism. |

  ## Evidence boundary

  Each mapping below is partial evidence. A PolicyReport shows what the cluster
  admitted. It does not discharge an ISM control, and it is not an assessment.

  - **ISM-1246**: Findings show selected Kubernetes workload hardening settings; they do not prove that all ASD and vendor guidance was identified, reconciled or implemented.
  - **ISM-1604**: Findings show selected container isolation and workload hardening settings; they do not assess the Kubernetes control plane, node runtime configuration or every administrative interface used to manage the isolation mechanism.

  ## Policies in this package

  - `ism-workload-hardening-security-context`: ISM Workload Hardening: Security Context (severity: high)
  - `ism-workload-hardening-block-host-namespaces`: ISM Workload Hardening: Block Host Namespaces (severity: critical)
  - `ism-workload-hardening-block-host-path`: ISM Workload Hardening: Block hostPath Volumes (severity: critical)
  - `ism-workload-hardening-require-read-only-rootfs`: ISM Workload Hardening: Read-Only Root Filesystem (severity: medium)

  ## Notes

  The hostPath policy applies to production namespaces only. Scope out platform components that need hostPath by namespace label.

  The canonical mapping, its ASD OSCAL provenance and the Kyverno test suite are
  maintained at https://github.com/Latticework-Systems/ism-kubernetes-controls.
