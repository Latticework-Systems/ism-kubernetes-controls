readme: |
  # ISM Application Control

  Restricts workloads to images from an approved registry list, blocks mutable 'latest' tags, and blocks privileged containers and the SYS_ADMIN capability.

  ## ISM controls evidenced

  | Control | Coverage | Title |
  | --- | --- | --- |
  | ISM-1490 | partial | Application control is implemented on internet-facing servers. |
  | ISM-1657 | partial | Application control restricts the execution of executables, libraries, scripts, installers, compiled HTML, HTML applications and control panel applets to an organisation-approved set. |
  | ISM-1871 | partial | Application control is applied to all locations other than user profiles and temporary folders used by operating systems, web browsers and email clients. |

  ## Evidence boundary

  Every mapping in this package is partial evidence unless stated otherwise. A
  PolicyReport shows what the cluster admitted; it does not by itself discharge
  an ISM control or constitute an assessment.

  - **ISM-1490** — Scan and PolicyReport results show workload image and execution guardrails on Kubernetes servers; they do not prove host or endpoint application control.
  - **ISM-1657** — Approved-image and workload-execution findings evidence the Kubernetes translation of application control; they do not inspect binaries inside images.
  - **ISM-1871** — Cluster-wide workload findings show whether the Kubernetes translation is applied across scanned namespaces; they do not assess host filesystem locations.

  ## Policies in this package

  - `ism-application-control-approved-registry` — ISM — Application Control: Approved Registry (severity: high)
  - `ism-application-control-no-latest-tag` — ISM — Application Control: No Latest Tag (severity: high)
  - `ism-application-control-no-privileged` — ISM — Application Control: No Privileged Containers (severity: critical)

  ## Notes

  The approved registry list is read at admission time from the `ism-approved-registries` ConfigMap, which is not shipped in this package. Create it in the `kyverno` namespace before enforcing — see https://github.com/Latticework-Systems/ism-kubernetes-controls/blob/main/policies/application-control/policy.yaml.

  The canonical mapping, its ASD OSCAL provenance and the Kyverno test suite are
  maintained at https://github.com/Latticework-Systems/ism-kubernetes-controls.
