readme: |
  # ISM Patch Operating Systems

  Requires workloads to declare their base image and blocks base images whose distribution has reached end of life.

  ## ISM controls evidenced

  | Control | Coverage | Title |
  | --- | --- | --- |
  | ISM-1501 | partial | Operating systems that are no longer supported by vendors are replaced. |
  | ISM-1694 | partial | Patches, updates or other vendor mitigations for vulnerabilities in operating systems of internet-facing servers and internet-facing network devices are applied within two weeks of release when vulnerabilities are assessed as non-critical by vendors and no working exploits exist. |
  | ISM-1695 | partial | Patches, updates or other vendor mitigations for vulnerabilities in operating systems of workstations, non-internet-facing servers and non-internet-facing network devices are applied within one month of release. |
  | ISM-1877 | partial | Patches, updates or other vendor mitigations for vulnerabilities in operating systems of internet-facing servers and internet-facing network devices are applied within 48 hours of release when vulnerabilities are assessed as critical by vendors or when working exploits exist. |

  ## Evidence boundary

  Every mapping in this package is partial evidence unless stated otherwise. A
  PolicyReport shows what the cluster admitted; it does not by itself discharge
  an ISM control or constitute an assessment.

  - **ISM-1501** — PolicyReports show declared container base-image support state; they do not prove Kubernetes node operating systems are supported or patched.
  - **ISM-1694** — PolicyReports show declared container base-image support metadata; they do not prove patch timing for node operating systems or network devices.
  - **ISM-1695** — PolicyReports show declared container base-image support metadata; they do not prove patch timing for node operating systems, workstations or network devices.
  - **ISM-1877** — Container base-image support metadata is supporting evidence only; criticality, exploit status and node or network-device patch timing remain external.

  ## Policies in this package

  - `ism-patch-operating-systems-require-base-image-label` — ISM — Patch OS: Require Base Image Annotation (severity: medium)
  - `ism-patch-operating-systems-block-eol-base-images` — ISM — Patch OS: Block End-of-Life Base Images (severity: high)

  ## Notes

  The end-of-life list is held in the policy and must be reviewed as distributions reach end of support.

  The canonical mapping, its ASD OSCAL provenance and the Kyverno test suite are
  maintained at https://github.com/Latticework-Systems/ism-kubernetes-controls.
