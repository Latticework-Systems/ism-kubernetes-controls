name: ISM Mapping

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make mapping-check
      - name: Prove deterministic generation
        run: |
          python scripts/generate_views.py --output /tmp/e8-first.yaml --kubescape-output /tmp/kubescape-first.json
          python scripts/generate_views.py --output /tmp/e8-second.yaml --kubescape-output /tmp/kubescape-second.json
          cmp /tmp/e8-first.yaml /tmp/e8-second.yaml
          cmp /tmp/kubescape-first.json /tmp/kubescape-second.json
