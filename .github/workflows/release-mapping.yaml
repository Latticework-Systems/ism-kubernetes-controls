name: Publish Kubescape mapping

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Require a tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Validate mapping
        run: |
          pip install -r requirements-dev.txt
          make mapping-check

      - name: Stage release assets
        run: |
          mkdir release
          cp mapping/views/kubescape.json release/kubescape.json
          cd release
          sha256sum kubescape.json > kubescape.json.sha256

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/kubescape.json \
            release/kubescape.json.sha256 \
            --verify-tag \
            --generate-notes \
            --title "ISM Kubernetes controls $GITHUB_REF_NAME"
          gh release verify "$GITHUB_REF_NAME"
