# Relationships between existing kubescape/regolibrary controls and ISM controls.
# generate_views.py renders this into views/regolibrary-ism.json, the
# frameworks/ism.json contributed upstream. ISM statements come from ism-mapping.yaml.
schema_version: '1.0'
ism_release: 2026-09
generated: false
framework:
  name: ISM
  description: Kubernetes-observable evidence for controls in the Australian Signals Directorate's
    Information Security Manual (ISM), September 2026 (OSCAL v2026.09.4) - https://www.cyber.gov.au/ism.
    Findings are partial evidence only; they do not establish ISM compliance.
  version: '2026.09'
controls:
- control_id: C-0013
  name: Non-root containers
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-non-root-containers
  rationale: The local rule adapts this control; the upstream rule also requires runAsGroup.
  description: Containers run as a non-root user and group. Running as root is functionality
    most workloads do not need, and it weakens the container isolation boundary.
  evidence_boundary: A pass shows that scanned workloads do not run as root. It does not show
    that all ASD and vendor hardening guidance was identified, reconciled or implemented,
    and it does not assess the Kubernetes control plane, node runtime configuration or the
    administrative interfaces used to manage the isolation mechanism.
- control_id: C-0016
  name: Allow privilege escalation
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-no-privilege-escalation
  rationale: The local rule adapts this control.
  description: Containers set allowPrivilegeEscalation to false, so a process cannot gain
    more privileges than its parent.
  evidence_boundary: A pass shows that scanned containers block privilege escalation. It does
    not show that all ASD and vendor hardening guidance was identified, reconciled or implemented,
    and it does not assess the Kubernetes control plane, node runtime configuration or the
    administrative interfaces used to manage the isolation mechanism.
- control_id: C-0017
  name: Immutable container filesystem
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-readonly-root-filesystem
  rationale: The local rule adapts this control; the upstream rule does not exempt Kubernetes
    system namespaces.
  description: Containers use a read-only root filesystem, so a compromised process cannot
    change the container's files at runtime.
  evidence_boundary: A pass shows that scanned containers mount their root filesystem read-only.
    It does not show that all ASD and vendor hardening guidance was identified, reconciled
    or implemented, and it does not assess the Kubernetes control plane, node runtime configuration
    or the administrative interfaces used to manage the isolation mechanism.
- control_id: C-0030
  name: Ingress and Egress blocked
  ism_ids:
  - ISM-1182
  - ISM-1416
  related_checks:
  - ism-network-policy-coverage
  rationale: The local rule adapts this control and requires both ingress and egress policy.
    The upstream rule passes a pod selected by a policy for either direction, and its NetworkPolicy
    matching ignores matchExpressions.
  description: Every pod is selected by a network policy that restricts its ingress or egress
    traffic. Pods that no policy selects are reported.
  evidence_boundary: A pass shows that each scanned pod is selected by at least one NetworkPolicy,
    CiliumNetworkPolicy or CiliumClusterwideNetworkPolicy that restricts ingress or egress.
    A policy for one direction is enough to pass, so a pass does not show that both directions
    are restricted. NetworkPolicy matching uses matchLabels and ignores matchExpressions,
    so a policy can be counted for a pod it does not select. It does not show that the allowed
    flows match business need, that the cluster network plugin enforces the policies, or that
    host firewalls and an organisation-approved list of applications and services exist.
- control_id: C-0038
  name: Host PID/IPC privileges
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-no-host-access
  rationale: One of the four upstream host-isolation controls that the local rule combines.
  description: Pods do not share the host's process ID or IPC namespace, so containers cannot
    see or signal host processes.
  evidence_boundary: A pass shows that scanned pods set neither hostPID nor hostIPC. It does
    not show that all ASD and vendor hardening guidance was identified, reconciled or implemented,
    and it does not assess the Kubernetes control plane, node runtime configuration or the
    administrative interfaces used to manage the isolation mechanism.
- control_id: C-0041
  name: HostNetwork access
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-no-host-access
  rationale: One of the four upstream host-isolation controls that the local rule combines.
  description: Pods do not use the host's network namespace, so containers cannot reach host
    network interfaces directly.
  evidence_boundary: A pass shows that scanned pods do not set hostNetwork. It does not show
    that all ASD and vendor hardening guidance was identified, reconciled or implemented,
    and it does not assess the Kubernetes control plane, node runtime configuration or the
    administrative interfaces used to manage the isolation mechanism.
- control_id: C-0044
  name: Container hostPort
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-no-host-access
  rationale: One of the four upstream host-isolation controls that the local rule combines.
  description: Containers do not bind ports on the node, so workloads are reached through
    Services rather than directly on the host.
  evidence_boundary: A pass shows that scanned containers declare no hostPort. It does not
    show that all ASD and vendor hardening guidance was identified, reconciled or implemented,
    and it does not assess the Kubernetes control plane, node runtime configuration or the
    administrative interfaces used to manage the isolation mechanism.
- control_id: C-0046
  name: Insecure capabilities
  ism_ids:
  - ISM-1246
  - ISM-1604
  - ISM-2128
  related_checks:
  - ism-drop-all-capabilities
  rationale: The local rule requires dropping ALL capabilities. The upstream rule instead
    rejects added capabilities on the insecureCapabilities list, whose default includes SYS_MODULE,
    so it also gives ISM-2128 evidence that the local rule does not.
  description: Containers do not add Linux capabilities from the configured list of insecure
    capabilities (insecureCapabilities). The default list includes SYS_MODULE, which allows
    loading kernel modules.
  evidence_boundary: A pass shows that scanned containers add no capability on the configured
    insecure list. It does not show that containers drop every capability they do not need.
    It does not show that all ASD and vendor hardening guidance was identified, reconciled
    or implemented, and it does not assess the Kubernetes control plane, node runtime configuration
    or the administrative interfaces used to manage the isolation mechanism. For ISM-2128,
    a pass shows that no scanned container adds SYS_MODULE only while the insecureCapabilities
    list includes it, as the default list does. It does not assess node access or which privileged
    users may modify kernel-mode code.
- control_id: C-0048
  name: HostPath mount
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-no-host-access
  rationale: One of the four upstream host-isolation controls that the local rule combines.
  description: Pods do not mount directories from the node's filesystem, so containers cannot
    read or change host files.
  evidence_boundary: A pass shows that no scanned container mounts a hostPath volume. It does
    not show that all ASD and vendor hardening guidance was identified, reconciled or implemented,
    and it does not assess the Kubernetes control plane, node runtime configuration or the
    administrative interfaces used to manage the isolation mechanism.
- control_id: C-0057
  name: Privileged container
  ism_ids:
  - ISM-1246
  - ISM-1490
  - ISM-1604
  - ISM-1657
  - ISM-1871
  - ISM-2128
  related_checks:
  - ism-no-privileged-containers
  rationale: The local rule adapts this control.
  description: Containers do not run privileged or with the SYS_ADMIN capability. A privileged
    container has access to the host's devices and kernel, so it can execute code outside
    the workload's isolation and execution restrictions.
  evidence_boundary: A pass shows that no scanned container runs privileged or adds SYS_ADMIN,
    across the namespaces visible to the scan. This is the Kubernetes translation of application
    control. It does not show host or endpoint application control, does not inspect binaries
    inside images, and does not assess host filesystem locations. It does not show that all
    ASD and vendor hardening guidance was identified, reconciled or implemented, and it does
    not assess the Kubernetes control plane, node runtime configuration or the administrative
    interfaces used to manage the isolation mechanism. For ISM-2128, privileged mode grants
    every capability, including loading kernel modules. This control does not report a container
    that adds SYS_MODULE without privileged mode (C-0046 does), and it does not assess node
    access or which privileged users may modify kernel-mode code.
- control_id: C-0078
  name: Images from allowed registry
  ism_ids:
  - ISM-1490
  - ISM-1657
  - ISM-1871
  related_checks:
  - ism-allowed-registries
  rationale: The local rule adapts this control; the upstream v1 rule checks regular containers
    only and is skipped until imageRepositoryAllowList is set.
  description: Container images come only from the organisation-approved registries listed
    in imageRepositoryAllowList. Kubescape skips this control until the list is set.
  evidence_boundary: A pass shows that every regular container image in the scanned workloads
    starts with an entry in imageRepositoryAllowList, across the namespaces visible to the
    scan. It does not check init or ephemeral container images. This is the Kubernetes translation
    of application control. It does not show host or endpoint application control, does not
    inspect binaries inside images, and does not assess host filesystem locations.
- control_id: C-0185
  name: Ensure that the cluster-admin role is only used where required
  ism_ids:
  - ISM-1883
  related_checks:
  - ism-no-cluster-admin-binding
  rationale: The local rule adapts this control.
  description: Lists the subjects bound to the cluster-admin ClusterRole, so each binding
    can be checked against the duties that require it.
  evidence_boundary: This control runs on cluster scans only. Each finding names a subject
    bound to cluster-admin through a ClusterRoleBinding, which can include Kubernetes defaults
    such as the system:masters group. ISM-1883 concerns privileged user accounts, so service-account
    findings are context rather than direct evidence. The scan cannot establish which human
    accounts require access to online services, and it does not assess other broad RBAC grants,
    the authorisation workflow, human account lifecycle, or access to systems outside Kubernetes.
- control_id: C-0187
  name: Minimize wildcard use in Roles and ClusterRoles
  ism_ids:
  - ISM-1883
  related_checks:
  - ism-no-wildcard-permissions
  rationale: The upstream rule reports subjects with wildcard verbs on wildcard resources,
    which is administrator-equivalent access rather than all wildcard use; the custom local
    rule checks any wildcard.
  description: Lists the subjects bound to a Role or ClusterRole that grants all verbs on
    all resources, in the core API group or in every API group, so administrator-equivalent
    access can be checked against the duties that require it.
  evidence_boundary: Each finding names a subject granted wildcard verbs on wildcard resources
    through a RoleBinding or ClusterRoleBinding, including roles other than cluster-admin.
    Rules that use a wildcard for only some of these fields are not reported. ISM-1883 concerns
    privileged user accounts, so service-account findings are context rather than direct evidence.
    The scan cannot establish which human accounts require access to online services, and
    it does not assess the authorisation workflow, human account lifecycle, or access to systems
    outside Kubernetes.
- control_id: C-0189
  name: Ensure that default service accounts are not actively used
  ism_ids:
  - ISM-2143
  related_checks:
  - ism-privileged-access-mutate-default-sa
  - ism-privileged-access-require-dedicated-sa
  rationale: Checks the same default service-account properties as the Kyverno policies mapped
    to ISM-2143.
  description: Each namespace has a service account other than default, and the default service
    account does not mount its token into pods by default, so workloads are steered away from
    a shared namespace credential.
  evidence_boundary: A pass shows that scanned namespaces have a dedicated service account
    and that default service accounts set automountServiceAccountToken to false. It does not
    show that each workload uses its own service account, that credentials differ between
    environments, or anything about credentials held outside Kubernetes service accounts.
- control_id: C-0210
  name: Ensure that the seccomp profile is set to docker/default in your pod definitions
  ism_ids:
  - ISM-1246
  - ISM-1604
  related_checks:
  - ism-seccomp-profile
  rationale: Replaces C-0055, which now accepts any seccomp profile including Unconfined.
    The upstream rule checks regular containers only; the local rule also accepts Localhost
    profiles.
  description: Regular containers run with the RuntimeDefault seccomp profile, set at pod
    or container level, which limits the system calls a container can make to the host kernel.
  evidence_boundary: A pass shows that every regular container in the scanned workloads runs
    with seccompProfile type RuntimeDefault, set at pod or container level. Init and ephemeral
    containers are not checked. Workloads that use a Localhost profile are reported even when
    that profile is stricter. It does not show that all ASD and vendor hardening guidance
    was identified, reconciled or implemented, and it does not assess the Kubernetes control
    plane, node runtime configuration or the administrative interfaces used to manage the
    isolation mechanism.
