    coverage: automated
    layers: [workload]
    rationale: >-
      Kyverno scan-status declaration only; scanner runs, database freshness and completed coverage
      need pipeline/ECR scan records.

  - ism_id: ISM-1809
    title: >-
      When applications, operating systems, network devices or networked IT equipment that are no
      longer supported by vendors cannot be immediately removed or replaced, compensating controls
      are implemented until such time that they can be removed or replaced.
    coverage: document
    layers: [organisation]
    rationale: >-
      System/incident/key/monitoring/backup/risk/retention procedures require approved
      organisational records; configuration is supporting evidence only.

  - ism_id: ISM-1810
    title: >-
      Backups of data, applications and settings are synchronised to enable restoration to a common
      point in time.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Backup consistency/security configuration is partially detectable; require actual recovery
      points, encryption/storage evidence and recovery tests externally.

  - ism_id: ISM-1811
    title: Backups of data, applications and settings are retained in a secure and resilient manner.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Backup consistency/security configuration is partially detectable; require actual recovery
      points, encryption/storage evidence and recovery tests externally.

  - ism_id: ISM-1812
    title: Unprivileged user accounts cannot access backups belonging to other user accounts.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [kyverno, aws-account]
    rationale: >-
      Backup access/mutation restrictions need backup-controller RBAC plus storage IAM tests and
