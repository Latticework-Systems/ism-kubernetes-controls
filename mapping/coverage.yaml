    coverage: buildable
    layers: [node]
    collectors: [aws-account]
    rationale: >-
      Worker vulnerability scan schedules/results plus node inventory; configuration alone cannot
      prove actual scan intervals. Fargate host maintenance inherited.

  - ism_id: ISM-1702
    title: >-
      A vulnerability scanner is used at least fortnightly to identify missing patches or updates
      for vulnerabilities in operating systems of workstations, non-internet-facing servers and
      non-internet-facing network devices.
    coverage: buildable
    layers: [node]
    collectors: [aws-account]
    rationale: >-
      Worker vulnerability scan schedules/results plus node inventory; configuration alone cannot
      prove actual scan intervals. Fargate host maintenance inherited.

  - ism_id: ISM-1704
    title: >-
      Office productivity suites, web browsers and their extensions, email clients, PDF
      applications, Adobe Flash Player, and security products that are no longer supported by
      vendors are removed.
    coverage: outside-platform
    layers: [endpoint]
    rationale: >-
      Endpoint application patch/scanner/support obligations require endpoint inventory; separately
      review platform security agents where applicable.

  - ism_id: ISM-1705
    title: >-
      Privileged user accounts (excluding backup administrator accounts) cannot access backups
      belonging to other user accounts.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [kyverno, aws-account]
    rationale: >-
      Backup access/mutation restrictions need backup-controller RBAC plus storage IAM tests and
      backup-service records; current PVC-label check does not test these.

  - ism_id: ISM-1707
    title: >-
      Privileged user accounts (excluding backup administrator accounts) are prevented from
      modifying and deleting backups.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [kyverno, aws-account]
    rationale: >-
      Backup access/mutation restrictions need backup-controller RBAC plus storage IAM tests and
      backup-service records; current PVC-label check does not test these.

  - ism_id: ISM-1708
    title: >-
      Backup administrator accounts are prevented from modifying and deleting backups during their
      retention period.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Backup administrator deletion restrictions need storage retention and IAM enforcement tests;
      no local detector.

  - ism_id: ISM-1787
    title: >-
      Operating systems, applications, IT equipment, OT equipment and services are sourced from
      approved suppliers.
    coverage: buildable
    layers: [workload]
    collectors: [kyverno]
    rationale: >-
      Signed image/artifact and approved supplier evidence are candidates; registry allowlisting
      does not verify content authenticity or supplier acceptance.

  - ism_id: ISM-1791
    title: >-
      The integrity of operating systems, applications, IT equipment, OT equipment and services are
      assessed as part of acceptance of products and services.
    coverage: buildable
    layers: [workload]
    collectors: [kyverno]
    rationale: >-
      Signed image/artifact and approved supplier evidence are candidates; registry allowlisting
      does not verify content authenticity or supplier acceptance.

  - ism_id: ISM-1792
    title: >-
      The authenticity of operating systems, applications, IT equipment, OT equipment and services
      are assessed as part of acceptance of products and services.
    coverage: buildable
    layers: [workload]
    collectors: [kyverno]
    rationale: >-
      Signed image/artifact and approved supplier evidence are candidates; registry allowlisting
      does not verify content authenticity or supplier acceptance.

  - ism_id: ISM-1807
    title: >-
      An automated method of asset discovery is used at least fortnightly to support the detection
      of assets for subsequent vulnerability scanning activities.
    coverage: buildable
    layers: [cluster, node]
    collectors: [node-inventory, aws-account]
    rationale: >-
      Inventory collector coverage and dated discovery runs needed; API listing can supply assets
      but no cadence/completeness detector is mapped.

  - ism_id: ISM-1808
    title: >-
