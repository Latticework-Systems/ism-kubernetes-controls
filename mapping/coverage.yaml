      they occur.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Logging fields/time/centralisation/format/delivery/access/retention need node and account
      configuration plus sampled logs; AWS service provision is only one slice.

  - ism_id: ISM-1984
    title: >-
      Event logs sent to a centralised event logging facility are encrypted in transit using
      Australian Signals Directorate (ASD)-approved cryptography.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Transport/algorithm configuration needs node/ingress/application and AWS endpoint
      observations; encryption enabled alone does not establish approved algorithms.

  - ism_id: ISM-1985
    title: Event logs are protected from unauthorised access.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Logging fields/time/centralisation/format/delivery/access/retention need node and account
      configuration plus sampled logs; AWS service provision is only one slice.

  - ism_id: ISM-1986
    title: >-
      Event logs from critical servers are analysed in a timely manner to detect cyber security
      events.
    coverage: document
    layers: [organisation]
    rationale: >-
      Critical-server log analysis requires SOC investigation/timing records; a collector cannot
      prove human analysis.

  - ism_id: ISM-1988
    title: Event logs are retained in a searchable manner for at least 12 months.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Logging fields/time/centralisation/format/delivery/access/retention need node and account
      configuration plus sampled logs; AWS service provision is only one slice.

  - ism_id: ISM-1989
    title: >-
      Event logs are retained as per minimum retention requirements for various classes of records
