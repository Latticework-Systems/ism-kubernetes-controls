    coverage: external-api
    layers: [identity]
    collectors: [identity-provider]
    rationale: >-
      Human/customer MFA semantics require IAM/IdP/application authentication evidence. Kubernetes
      ServiceAccounts cannot prove MFA. AWS IAM Config checks alone do not cover federated users.

  - ism_id: ISM-1682
    title: >-
      Multi-factor authentication used for authenticating users of systems is phishing-resistant.
    coverage: external-api
    layers: [identity]
    collectors: [identity-provider]
    rationale: >-
      Human/customer MFA semantics require IAM/IdP/application authentication evidence. Kubernetes
      ServiceAccounts cannot prove MFA. AWS IAM Config checks alone do not cover federated users.

  - ism_id: ISM-1683
    title: Successful and unsuccessful multi-factor authentication events are centrally logged.
    coverage: external-api
    layers: [identity]
    collectors: [identity-provider]
    rationale: >-
      MFA event collection is an IdP/IAM log obligation; cannot infer it from Kubernetes audit logs.

  - ism_id: ISM-1685
    title: >-
      Credentials for break glass accounts, local administrator accounts and service accounts are
      long, unique, unpredictable and managed.
    coverage: automated
    layers: [cluster]
    rationale: >-
      Kyverno legacy-token Secret type, admission only. Credential lifecycle/rotation and IdP/KMS
      evidence external.

  - ism_id: ISM-1687
    title: >-
      Privileged operating environments are not virtualised within unprivileged operating
      environments.
    coverage: external-api
    layers: [identity]
    collectors: [identity-provider, aws-account]
    rationale: >-
      Administrative access paths and separated privileged environments require bastion/endpoint/IdP
      evidence; Pod namespace separation is insufficient.

  - ism_id: ISM-1688
    title: Unprivileged user accounts cannot logon to privileged operating environments.
    coverage: external-api
    layers: [identity]
    collectors: [identity-provider, aws-account]
    rationale: >-
      Administrative access paths and separated privileged environments require bastion/endpoint/IdP
      evidence; Pod namespace separation is insufficient.

  - ism_id: ISM-1689
    title: >-
      Privileged user accounts (excluding local administrator accounts) cannot logon to unprivileged
      operating environments.
    coverage: external-api
    layers: [identity]
    collectors: [identity-provider, aws-account]
    rationale: >-
      Administrative access paths and separated privileged environments require bastion/endpoint/IdP
      evidence; Pod namespace separation is insufficient.

  - ism_id: ISM-1690
    title: >-
      Patches, updates or other vendor mitigations for vulnerabilities in online services are
      applied within two weeks of release when vulnerabilities are assessed as non-critical by
      vendors and no working exploits exist.
    coverage: automated
    layers: [workload]
    rationale: >-
      Kyverno image-age/build metadata only; actual vulnerability severity, release date and
      remediation clock need trusted pipeline records.

  - ism_id: ISM-1691
    title: >-
      Patches, updates or other vendor mitigations for vulnerabilities in office productivity
      suites, web browsers and their extensions, email clients, PDF applications, and security
      products are applied within two weeks of release.
    coverage: outside-platform
    layers: [endpoint]
    rationale: >-
      Endpoint application patch/scanner/support obligations require endpoint inventory; separately
      review platform security agents where applicable.

  - ism_id: ISM-1693
    title: >-
      Patches, updates or other vendor mitigations for vulnerabilities in applications other than
      office productivity suites, web browsers and their extensions, email clients, PDF
      applications, and security products are applied within one month of release.
    coverage: automated
    layers: [workload]
    rationale: >-
      Kyverno image-age/build metadata only; actual vulnerability severity, release date and
      remediation clock need trusted pipeline records.

  - ism_id: ISM-1694
    title: >-
