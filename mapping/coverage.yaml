# Canonical coverage census: every ISM control this project has reviewed for
# Kubernetes platforms, including controls with no detector.
#
# Detectors live in ism-mapping.yaml. This file records where each control's
# evidence lives (layers), how far this project can produce it (coverage) and
# which collector would produce it (collectors). Responsibility between the
# customer and the cloud provider is not recorded here: join it at run time
# from the customer's own provider controls matrix (scripts/import_cscm.py).
#
# A `node` layer moves to the provider on EKS Fargate.
schema_version: "1.0"
ism_release: "2026-06"
generated: false
controls:
  - ism_id: ISM-0041
    title: >-
      Systems have a system security plan that includes an overview of the system (covering the
      system’s purpose, the system boundary and how the system is managed) as well as an annex that
      covers applicable controls from this document and any additional controls that have been
      identified and implemented.
    coverage: document
    layers: [organisation]
    rationale: >-
      System/incident/key/monitoring/backup/risk/retention procedures require approved
      organisational records; configuration is supporting evidence only.

  - ism_id: ISM-0043
    title: |-
      Systems have a cyber security incident response plan that covers the following:

      - guidelines on what constitutes a cyber security incident
      - the types of cyber security incidents likely to be encountered and the expected response to each type
      - how to report cyber security incidents, internally to an organisation and externally to relevant authorities
      - other parties that need to be informed in the event of a cyber security incident
      - the authority, or authorities, responsible for investigating and responding to cyber security incidents
      - the criteria by which an investigation of a cyber security incident would be requested from a law enforcement agency, the Australian Signals Directorate or other relevant authority
      - the steps necessary to ensure the integrity of evidence relating to a cyber security incident
      - system contingency measures or a reference to such details if they are in a separate document.
    coverage: document
    layers: [organisation]
    rationale: >-
      System/incident/key/monitoring/backup/risk/retention procedures require approved
      organisational records; configuration is supporting evidence only.

  - ism_id: ISM-0123
    title: >-
      Cyber security incidents are reported to the chief information security officer, or one of
      their delegates, as soon as possible after they occur or are discovered.
    coverage: document
    layers: [organisation]
    rationale: >-
      Incident notification/response execution requires incident records and accountable
      organisational staff; API configuration cannot prove it.

  - ism_id: ISM-0140
    title: >-
      Cyber security incidents are reported to ASD as soon as possible after they occur or are
      discovered.
    coverage: document
    layers: [organisation]
    rationale: >-
      Incident notification/response execution requires incident records and accountable
      organisational staff; API configuration cannot prove it.

  - ism_id: ISM-0298
    title: >-
      A centralised and managed approach that maintains the integrity of patches or updates, and
      confirms that they have been applied successfully, is used to patch or update applications,
      operating systems, drivers and firmware.
    coverage: buildable
    layers: [node]
    collectors: [node-inventory]
    rationale: >-
      Node patch/support inventory and successful rollout checks missing; combine signed AMI/version
      provenance, vulnerability dates and deployment state. Control-plane/Fargate host slice
      provider-owned.

  - ism_id: ISM-0445
    title: >-
      Privileged users are assigned a dedicated privileged user account to be used solely for duties
      requiring privileged access.
    coverage: automated
    layers: [cluster]
    rationale: >-
      Dedicated/default SA settings only; human privileged accounts and September meaning need
      review. Kyverno privileged-access; IdP/account approvals external.

  - ism_id: ISM-0459
    title: >-
      Full disk encryption, or partial encryption where access controls only allow writing to
      encrypted partitions or volumes, is implemented when encrypting media.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      At-rest encryption needs volume/storage and API-data/KMS evidence. ENCRYPTED_VOLUMES is a
      candidate, not an etcd check; validate default EKS encryption separately.

  - ism_id: ISM-0469
    title: An AACP or high assurance cryptographic protocol is used when encrypting data in transit.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [kyverno, aws-account]
    rationale: >-
      Transport/algorithm configuration needs node/ingress/application and AWS endpoint
      observations; encryption enabled alone does not establish approved algorithms.

  - ism_id: ISM-0471
    title: >-
      Only AACAs or high assurance cryptographic algorithms are used by cryptographic equipment,
      applications and libraries.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [kyverno, aws-account]
    rationale: >-
      Transport/algorithm configuration needs node/ingress/application and AWS endpoint
      observations; encryption enabled alone does not establish approved algorithms.

