  - ism_id: ISM-1905
    title: Online services that are no longer supported by vendors are removed.
    coverage: buildable
    layers: [workload]
    rationale: >-
      Online-service support state needs trusted component inventory/vendor lifecycle data; image
      age does not establish support.

  - ism_id: ISM-1906
    title: >-
      Event logs from internet-facing servers are analysed in a timely manner to detect cyber
      security events.
    coverage: document
    layers: [organisation]
    rationale: >-
      Timely security analysis requires SOC case/response timestamps, not merely enabled logging.

  - ism_id: ISM-1959
    title: >-
      To the extent possible, event logs are captured and stored in a consistent and structured
      format.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [aws-account]
    rationale: >-
      Logging fields/time/centralisation/format/delivery/access/retention need node and account
      configuration plus sampled logs; AWS service provision is only one slice.

  - ism_id: ISM-1974
    title: >-
      Non-classified servers, network devices and cryptographic equipment are secured in suitably
      secure server rooms or communications rooms.
    coverage: provider-report
    layers: [provider]
    rationale: >-
      AWS-facility physical/access protection slice: use applicable private assessment evidence.
      1053 classification/site applicability must be confirmed; customer facilities are outside this
      inherited slice.

  - ism_id: ISM-1977
    title: Security-relevant events for Linux operating systems are centrally logged.
    coverage: buildable
    layers: [node]
    collectors: [aws-account]
    rationale: >-
      Host integrity/Linux security-event collection missing; combine host findings and delivery
      verification. Fargate underlying host evidence inherited.

  - ism_id: ISM-1983
    title: >-
