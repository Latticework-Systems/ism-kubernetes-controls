    coverage: buildable
    layers: [workload]
    rationale: >-
      Application log sufficiency and sensitive-data handling need application tests/log sampling;
      admission metadata cannot establish runtime log content.

  - ism_id: ISM-2052
    title: Event logs produced by software ensure that any sensitive data is protected.
    coverage: buildable
    layers: [workload]
    rationale: >-
      Application log sufficiency and sensitive-data handling need application tests/log sampling;
      admission metadata cannot establish runtime log content.
