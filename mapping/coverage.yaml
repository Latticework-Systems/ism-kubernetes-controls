      release when vulnerabilities are assessed as non-critical by vendors and no working exploits
      exist.
    coverage: automated
    layers: [workload, node]
    rationale: >-
      Kyverno base-image declarations only; customer image/patch pipeline. EC2 worker OS update
      evidence missing; Fargate host slice inherited, workload image still customer.

  - ism_id: ISM-1695
    title: >-
      Patches, updates or other vendor mitigations for vulnerabilities in operating systems of
      workstations, non-internet-facing servers and non-internet-facing network devices are applied
