  - ism_id: ISM-0813
    title: >-
      Server rooms, communications rooms and security containers are not left in unsecured states.
    coverage: provider-report
    layers: [provider]
    rationale: >-
      AWS-facility physical/access protection slice: use applicable private assessment evidence.
      1053 classification/site applicability must be confirmed; customer facilities are outside this
      inherited slice.

  - ism_id: ISM-0843
    title: Application control is implemented on workstations.
    coverage: outside-platform
    layers: [endpoint]
    rationale: >-
      Workstation/browser/Office/PDF application controls belong to endpoint management. Excluded
      from this Linux server platform profile; revisit Windows/desktop workloads explicitly.

