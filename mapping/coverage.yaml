    coverage: automated
    layers: [workload]
    rationale: >-
      Kyverno scan-status declaration only; scanner runs, database freshness and completed coverage
      need pipeline/ECR scan records.

  - ism_id: ISM-1699
    title: >-
      A vulnerability scanner is used at least weekly to identify missing patches or updates for
