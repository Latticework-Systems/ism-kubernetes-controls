  - ism_id: ISM-1814
    title: Unprivileged user accounts are prevented from modifying and deleting backups.
    coverage: buildable
    layers: [cluster, aws-account]
    collectors: [kyverno, aws-account]
    rationale: >-
      Backup access/mutation restrictions need backup-controller RBAC plus storage IAM tests and
