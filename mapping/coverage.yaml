  - ism_id: ISM-1902
    title: >-
      Patches, updates or other vendor mitigations for vulnerabilities in operating systems of
      workstations, non-internet-facing servers and non-internet-facing network devices are applied
      within one month of release when vulnerabilities are assessed as non-critical by vendors and
      no working exploits exist.
    coverage: buildable
    layers: [node]
    collectors: [node-inventory]
    rationale: >-
      Node patch/support inventory and successful rollout checks missing; combine signed AMI/version
      provenance, vulnerability dates and deployment state. Control-plane/Fargate host slice
