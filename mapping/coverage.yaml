    coverage: outside-platform
    layers: [endpoint]
    rationale: >-
      Endpoint application patch/scanner/support obligations require endpoint inventory; separately
      review platform security agents where applicable.

  - ism_id: ISM-1700
    title: >-
      A vulnerability scanner is used at least fortnightly to identify missing patches or updates
      for vulnerabilities in applications other than office productivity suites, web browsers and
      their extensions, email clients, PDF applications, and security products.
    coverage: automated
    layers: [workload]
    rationale: >-
      Kyverno scan-status declaration only; scanner runs, database freshness and completed coverage
